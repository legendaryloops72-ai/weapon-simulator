name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Run unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Run lint
        run: ./gradlew --no-daemon :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: weapon-simulator-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: weapon-simulator-lint-report
          path: app/build/reports/lint-results-debug.html
